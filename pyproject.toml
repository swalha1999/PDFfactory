# AgentScribe — project metadata, dependencies, and quality-gate config.
# uv-only (no pip/venv); commit pyproject.toml + uv.lock (docs/TODO.md T1.1).
# Runtime libraries (crewai, matplotlib, pypdf, ...) are added in the phase
# that first imports them (docs/AI_STACK.md); this scaffold pins only the
# tooling the CI gates need so `uv sync` stays fast and deterministic.

[project]
name = "agentscribe"
version = "0.1.0"
description = "CrewAI multi-agent pipeline that turns a topic into a typeset PDF via LaTeX."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.10",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscribe"]

# --- Lint & format (docs/TODO.md T1.3; PRD §4.3: 0 ruff violations) ---------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# T20 forbids print() in shipped code (PRD_observability_cost R1).
select = ["E", "F", "I", "B", "UP", "T20"]

# --- Type checking ----------------------------------------------------------
[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

# --- Tests & coverage (docs/TODO.md T1.3, T6.3; PRD §2 G5: >=85%) -----------
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentscribe"]
branch = true

[tool.coverage.report]
# The >=85% gate is config-driven here so CI carries no hard-coded number.
fail_under = 85
show_missing = true
